apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80



---
kind: Service

- Cluster Ip
- Node port 
- Load Balancer


---
# The "Service" section defines how to access the 5 Nginx pods above.
# I have commented out the three main types below:

# ---
# 1. CLUSTER IP (Default)
# Internal only. Use this for private communication between apps inside the cluster.
# ---
# apiVersion: v1
# kind: Service
